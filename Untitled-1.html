<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career Portal</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
<nav class = "wrap">
    <strong>
        Campus Careers
    </strong>
    <a href="#guide">Application Guide</a>
</nav>
    </header>
    <section class = "hero">
        <div class = "wrap">
        <h1>
            Find your Campus<br>opportunity.
        </h1>
        <p>
            Choose your internship
        </p>
        </div>
        <svg viewbox = "0 0 200 160">
            <circle cx = "200" cy = "170" r="155" fill="#FF9808"></circle>
            <circle cx = "200" cy = "170" r="125" fill="#ECCEA8"></circle>
            <circle cx = "200" cy = "170" r="95" fill="#A98585"></circle>


        </svg>
    </section>
    <main class ="wrap">
        <form id="application" class = "board"
        action = "complete.html">
    <fieldset class = "roles">
        <legend>Available Roles</legend>
        <p>Choose one role to open the application form.</p>
        <label class="card">
            <input id="web" type="radio" name="role"
            value="web" required>
        </label>
    </fieldset></form>

    </main>
</body>
</html>
